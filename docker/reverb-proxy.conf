# Meneruskan WebSocket protokol Pusher (pusher-js terhubung ke /app/{key})
# dari Apache (port publik Render, TLS diterminasi Render) ke server Reverb
# lokal di dalam container pada 127.0.0.1:8080.
#
# Hanya path /app yang diproxy; publikasi event sisi-server (Laravel → Reverb)
# memakai 127.0.0.1:8080 langsung sehingga /apps tidak perlu diproxy.
<IfModule mod_proxy.c>
    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass        /app ws://127.0.0.1:8080/app
    ProxyPassReverse /app ws://127.0.0.1:8080/app
</IfModule>
